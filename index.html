<!DOCTYPE html>

<head>

  <!-- Bootstrap -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <!-- Font Awesome -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
  />

  <link
    href="https://fonts.googleapis.com/css2?family=Pacifico&family=Quicksand:wght@400;600&display=swap"

          <li class="nav-item"><button class="btn btn-girly ms-3">Join Us</button></li>

      </div>
    </div>

  <main>
    <section class="shopping-card-container">
      <div class="total-price"></div>
      <div class="list-products"></div>

  <script src="js/script.js"></script>
